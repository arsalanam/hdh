# Alembic configuration (issue #7: migrations from registry-merged metadata).
#
# The database URL is resolved in migrations/env.py — HDH_DB_URL when set
# (the `just deps` PostgreSQL container), else the local SQLite file — so
# this file stays free of environment-specific values.
[alembic]
script_location = migrations
path_separator = os
# Keep generated filenames sortable by creation order
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
