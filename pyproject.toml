[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdh"
version = "0.2.0"
description = "Health Data Hub — medically realistic synthetic family-medicine EHR data, with modular care-gap, risk-stratification, agentic-AI, and FHIR extensions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["synthetic-data", "healthcare", "EHR", "FHIR", "agentic-ai", "risk-stratification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "SQLAlchemy>=2.0",
    "Faker>=19.0",
]

[project.optional-dependencies]
risk = ["scikit-learn>=1.3", "numpy>=1.24", "joblib>=1.3"]
agent = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
docs = ["python-docx>=1.1"]
dev = ["pytest>=8.0"]
all = ["hdh[risk,agent,api,docs,dev]"]

[project.scripts]
hdh = "hdh.cli:main"

[project.urls]
Documentation = "https://github.com/OWNER/hdh/blob/main/docs/FEATURE_GUIDE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
