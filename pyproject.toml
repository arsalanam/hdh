[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdh"
version = "0.4.0"
description = "Health Data Hub — medically realistic synthetic family-medicine EHR data, with modular care-gap, risk-stratification, agentic-AI, and FHIR extensions"
readme = "README.md"
authors = [{ name = "Ajmal Mahmood", email = "arsalanam@yahoo.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["synthetic-data", "healthcare", "EHR", "FHIR", "agentic-ai", "risk-stratification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "SQLAlchemy>=2.0",
    "Faker>=19.0",
    # PostgreSQL driver: core so `hdh migrate` and HDH_DB_URL work everywhere
    # (the SQLite retirement plan, docs/design/icd10cm-ontology-module.md §5.3)
    "psycopg[binary]>=3.1",
    # Schema migrations from registry-merged metadata (issue #7)
    "alembic>=1.13",
    # Typed FHIR R4B construction in the emitters (design fhir-emitters.md §6)
    "fhir.resources>=8.0",
]

[project.optional-dependencies]
risk = ["scikit-learn>=1.3", "numpy>=1.24", "joblib>=1.3"]
agent = [
    "anthropic>=0.40",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "langgraph>=1.2.10",
]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
docs = ["python-docx>=1.1"]
all = ["hdh[risk,agent,api,docs]"]

# Dev tooling (PEP 735): installed by `uv sync` automatically, never shipped.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
hdh = "hdh.cli:main"

[project.urls]
Documentation = "https://github.com/arsalanam/hdh/blob/main/docs/FEATURE_GUIDE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hdh"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # isort
    "B",               # bugbear
    "UP",              # pyupgrade
]

[tool.mypy]
files = ["src/hdh"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

# The ORM uses legacy Column-style declarations, so instance attributes type as
# Column[T] instead of their Python values. Until the models migrate to
# SQLAlchemy 2.0 Mapped[] typing, suppress that class of false positive in the
# modules that read ORM attributes heavily.
# (mypy overrides for legacy Column[] typing removed with the SQLAlchemy 2.0
# Mapped[] migration — issue #6)
